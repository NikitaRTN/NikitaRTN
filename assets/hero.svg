<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Ranavar — backend systems, developer tools and MCP infrastructure</title>
<desc id="desc">Engineering profile banner with a control-plane network diagram</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B14"/><stop offset=".58" stop-color="#0B1020"/><stop offset="1" stop-color="#10152A"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4FE1E8"/><stop offset="1" stop-color="#806CFF"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#4FE1E8" stop-opacity=".24"/><stop offset="1" stop-color="#4FE1E8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#AFC4FF" stroke-opacity=".055"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .muted{fill:#8C9AB9}.soft{fill:#C5CEE3}.white{fill:#F7FAFF}.cyan{fill:#4FE1E8}.violet{fill:#9A8CFF}
    .node{fill:#10182B;stroke:#253254}.chip{fill:#111A2E;stroke:#283755}.wire{fill:none;stroke:url(#line);stroke-width:1.5;stroke-opacity:.62}
  </style>
</defs>
