<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ranavar — Developer Profile</title>
  <desc id="desc">Animated dark developer banner with blue and violet accents</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#080B14"/><stop offset="0.5" stop-color="#101830"/><stop offset="1" stop-color="#150F2A"/></linearGradient>
    <linearGradient id="accent" x1="220" y1="130" x2="780" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#5E9FE8"/><stop offset="0.55" stop-color="#8B7CF6"/><stop offset="1" stop-color="#4FB9C9"/></linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.42" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#A9CFFF"/><stop offset="0.58" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 2 0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(1030 90) rotate(133) scale(360 300)" gradientUnits="userSpaceOnUse"><stop stop-color="#2783DE" stop-opacity="0.3"/><stop offset="1" stop-color="#2783DE" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientTransform="translate(140 380) rotate(-28) scale(420 270)" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6" stop-opacity="0.2"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <clipPath id="clip"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>
      .fade-up{opacity:0;animation:fadeUp .9s cubic-bezier(.22,.68,.35,1) forwards}
      @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .draw{stroke-dasharray:420;stroke-dashoffset:420;animation:drawLine 1.2s cubic-bezier(.22,.68,.35,1) .6s forwards}
      @keyframes drawLine{to{stroke-dashoffset:0}}
      .caret{animation:blink 1.1s step-end infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      .pulse{animation:pulse 2.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
      .twinkle{animation:twinkle 3.2s ease-in-out infinite}
      @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.85}}
      .float{animation:float 8s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @media (prefers-reduced-motion:reduce){.fade-up{opacity:1 !important;animation:none !important}.draw{stroke-dashoffset:0 !important;animation:none !important}.caret,.pulse,.twinkle,.float{animation:none !important}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#glowBlue)"/>
    <rect width="1200" height="420" fill="url(#glowViolet)"/>
    <circle cx="1050" cy="80" r="116" fill="#2783DE" fill-opacity="0.08" filter="url(#blur)" class="float"/>
    <circle cx="1120" cy="285" r="150" fill="#8B5CF6" fill-opacity="0.08" filter="url(#blur)" class="float" style="animation-duration:11s;animation-delay:-3s"/>
    <g opacity="0.6" class="float" style="animation-duration:9s">
      <circle cx="1048" cy="78" r="4" fill="#72BC8F"/>
      <path d="M1048 78L1120 138L1068 214L1148 278" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="1.5"/>
      <circle cx="1120" cy="138" r="5" fill="#5E9FE8" class="twinkle"/>
      <circle cx="1068" cy="214" r="4" fill="#8B7CF6" class="twinkle" style="animation-delay:.8s"/>
      <circle cx="1148" cy="278" r="6" fill="#4FB9C9"/>
      <path d="M934 130L990 190L938 258L1010 326" stroke="url(#accent)" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="934" cy="130" r="3" fill="#5E9FE8" class="twinkle" style="animation-delay:1.4s"/>
      <circle cx="990" cy="190" r="4" fill="#8B7CF6"/>
      <circle cx="938" cy="258" r="3" fill="#4FB9C9" class="twinkle" style="animation-delay:2s"/>
      <circle cx="1010" cy="326" r="5" fill="#72BC8F"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="196" cy="56" r="1.6" class="twinkle"/>
      <circle cx="342" cy="38" r="1.2" class="twinkle" style="animation-delay:.7s"/>
      <circle cx="520" cy="88" r="1.4" class="twinkle" style="animation-delay:1.3s"/>
      <circle cx="636" cy="44" r="1.2" class="twinkle" style="animation-delay:1.9s"/>
      <circle cx="760" cy="318" r="1.4" class="twinkle" style="animation-delay:2.5s"/>
      <circle cx="470" cy="352" r="1.2" class="twinkle" style="animation-delay:2.9s"/>
    </g>
    <g filter="url(#shadow)" class="fade-up" style="animation-delay:.05s">
      <rect x="74" y="70" width="70" height="70" rx="18" fill="#151D31" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <path d="M105 91L86 105L105 119M113 91L132 105L113 119" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="74" y="203" fill="url(#nameGrad)" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" class="fade-up" style="animation-delay:.2s">Ranavar</text>
    <path d="M74 226H482" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" class="draw"/>
    <text x="74" y="274" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" class="fade-up" style="animation-delay:.75s"><tspan fill="#C7D0E1">Developer</tspan><tspan fill="#5E9FE8"> · </tspan><tspan fill="#C7D0E1">Builder</tspan><tspan fill="#8B7CF6"> · </tspan><tspan fill="#C7D0E1">AI-assisted engineering</tspan></text>
    <text x="74" y="312" fill="#7F8BA3" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" class="fade-up" style="animation-delay:.9s">Web • API • Automation • Game Development</text>
    <g class="fade-up" style="animation-delay:1.05s"><g transform="translate(74 348)">
      <rect width="128" height="38" rx="9" fill="#5E9FE8" fill-opacity="0.13" stroke="#5E9FE8" stroke-opacity="0.45"/>
      <circle cx="20" cy="19" r="5" fill="#72BC8F" class="pulse"/>
      <text x="35" y="25" fill="#D8E8FA" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.8">BUILDING</text>
    </g></g>
    <g class="fade-up" style="animation-delay:1.15s"><g transform="translate(214 348)">
      <rect width="106" height="38" rx="9" fill="#8B7CF6" fill-opacity="0.12" stroke="#8B7CF6" stroke-opacity="0.4"/>
      <text x="18" y="25" fill="#E2DEFF" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.8">LEARNING</text>
    </g></g>
    <g class="fade-up" style="animation-delay:1.25s"><g transform="translate(332 348)">
      <rect width="110" height="38" rx="9" fill="#4FB9C9" fill-opacity="0.1" stroke="#4FB9C9" stroke-opacity="0.4"/>
      <text x="17" y="25" fill="#D7F5F7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.8">SHIPPING</text>
    </g></g>
    <g class="fade-up" style="animation-delay:.7s"><g transform="translate(825 96)" opacity="0.92">
      <rect width="278" height="214" rx="18" fill="#111827" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="24" cy="22" r="4" fill="#E97366"/>
      <circle cx="40" cy="22" r="4" fill="#EAC26B"/>
      <circle cx="56" cy="22" r="4" fill="#72BC8F"/>
      <text x="22" y="58" fill="#7F8BA3" font-family="Consolas, Menlo, monospace" font-size="14" class="fade-up" style="animation-delay:1s">const developer = {</text>
      <text x="38" y="85" fill="#9CC8F5" font-family="Consolas, Menlo, monospace" font-size="14" class="fade-up" style="animation-delay:1.15s">mindset:</text>
      <text x="115" y="85" fill="#B6E3C6" font-family="Consolas, Menlo, monospace" font-size="14" class="fade-up" style="animation-delay:1.2s">"curious"</text>
      <text x="38" y="112" fill="#9CC8F5" font-family="Consolas, Menlo, monospace" font-size="14" class="fade-up" style="animation-delay:1.3s">focus:</text>
      <text x="100" y="112" fill="#D8C8FF" font-family="Consolas, Menlo, monospace" font-size="14" class="fade-up" style="animation-delay:1.35s">"impact"</text>
      <text x="38" y="139" fill="#9CC8F5" font-family="Consolas, Menlo, monospace" font-size="14" class="fade-up" style="animation-delay:1.45s">status:</text>
      <text x="108" y="139" fill="#B6E3C6" font-family="Consolas, Menlo, monospace" font-size="14" class="fade-up" style="animation-delay:1.5s">"creating"</text>
      <text x="22" y="166" fill="#7F8BA3" font-family="Consolas, Menlo, monospace" font-size="14" class="fade-up" style="animation-delay:1.6s">};</text>
      <rect x="44" y="153" width="9" height="17" rx="2" fill="#8B93A7" class="caret"/>
    </g></g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="23.25" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="1.5"/>
</svg>