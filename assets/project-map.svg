<g transform="translate(514 284)">
  <rect class="box" width="206" height="66" rx="14"/><text class="mono cyan" x="18" y="25" font-size="9" font-weight="700">SSE PUSH</text><text class="sans white" x="18" y="49" font-size="16" font-weight="700">Browser panel :8765</text>
</g>
<g transform="translate(752 284)">
  <rect class="box" width="206" height="66" rx="14"/><text class="mono violet" x="18" y="25" font-size="9" font-weight="700">COMMITTED TELEMETRY</text><text class="sans white" x="18" y="49" font-size="16" font-weight="700">SQLite / WAL</text>
</g>
<path d="M637 239V263H617V284M637 263H855V284" fill="none" stroke="#806CFF" stroke-width="1.5" stroke-opacity=".7" marker-end="url(#arrow)"/>
<text class="mono muted" x="42" y="368" font-size="10">PYTHON STDLIB BACKEND · JAVASCRIPT UI · SAFE DEFAULTS</text>
