<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">MCP Hub 3 request and telemetry architecture</title>
<desc id="desc">Verified architecture based on the public mcp-stack repository</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B14"/><stop offset="1" stop-color="#10152A"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4FE1E8"/><stop offset="1" stop-color="#806CFF"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#AFC4FF" stroke-opacity=".045"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4FE1E8"/></marker>
  <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.white{fill:#F7FAFF}.muted{fill:#8C9AB9}.cyan{fill:#4FE1E8}.violet{fill:#9A8CFF}.box{fill:#0E1628;stroke:#2A395A}.mini{fill:#121C31;stroke:#263453}.flow{fill:none;stroke:url(#flow);stroke-width:2;marker-end:url(#arrow)}</style>
</defs>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#26314D"/><rect width="1200" height="390" rx="24" fill="url(#grid)"/>
<text class="mono cyan" x="42" y="47" font-size="12" font-weight="700" letter-spacing="2">MCP HUB 3 / REQUEST PATH</text>
<text class="mono muted" x="42" y="70" font-size="11">PUBLIC EDGE → LOOPBACK SERVICES → CONTROLLED UPSTREAMS</text>
<rect x="1017" y="29" width="141" height="29" rx="14.5" fill="#15233A" stroke="#344769"/><circle cx="1035" cy="43.5" r="4" fill="#4ADE80"/><text class="mono muted" x="1047" y="47" font-size="10">SELF-HOSTED</text>
<g transform="translate(42 111)">
  <g><rect class="box" width="206" height="128" rx="16"/><text class="mono violet" x="20" y="30" font-size="10" font-weight="700">01 / CLIENTS</text><text class="sans white" x="20" y="67" font-size="21" font-weight="700">Request origin</text><rect class="mini" x="20" y="83" width="75" height="26" rx="6"/><text class="mono muted" x="57" y="100" text-anchor="middle" font-size="9">MCP CLIENT</text><rect class="mini" x="103" y="83" width="83" height="26" rx="6"/><text class="mono muted" x="144" y="100" text-anchor="middle" font-size="9">EXPLORER</text></g>
  <g transform="translate(246)"><rect class="box" width="206" height="128" rx="16"/><text class="mono cyan" x="20" y="30" font-size="10" font-weight="700">02 / PUBLIC EDGE</text><text class="sans white" x="20" y="67" font-size="21" font-weight="700">Caddy :8443</text><text class="mono muted" x="20" y="93" font-size="10">HTTPS · HTTP/2</text><text class="mono muted" x="20" y="110" font-size="10">TOKEN · OAUTH · NONE</text></g>
  <g transform="translate(492)"><rect class="box" width="206" height="128" rx="16"/><text class="mono violet" x="20" y="30" font-size="10" font-weight="700">03 / INSPECTION</text><text class="sans white" x="20" y="67" font-size="21" font-weight="700">JSON-RPC path</text><text class="mono muted" x="20" y="93" font-size="10">STREAMING · NO BUFFER</text><text class="mono muted" x="20" y="110" font-size="10">INSPECTOR :8770</text></g>
  <g transform="translate(738)"><rect class="box" width="206" height="128" rx="16"/><text class="mono cyan" x="20" y="30" font-size="10" font-weight="700">04 / UPSTREAM</text><text class="sans white" x="20" y="67" font-size="21" font-weight="700">MCP services</text><text class="mono muted" x="20" y="93" font-size="10">STDIO · REMOTE HTTP</text><text class="mono muted" x="20" y="110" font-size="10">BEARER · OAUTH CLIENT</text></g>
  <g transform="translate(984)"><rect class="box" width="132" height="128" rx="16"/><text class="mono violet" x="18" y="30" font-size="10" font-weight="700">05 / RESULT</text><text class="sans white" x="18" y="67" font-size="18" font-weight="700">Tool data</text><text class="mono muted" x="18" y="93" font-size="9">JSON / SSE</text><text class="mono muted" x="18" y="110" font-size="9">TRACEABLE</text></g>
</g>
<path class="flow" d="M248 175H282M494 175H528M740 175H774M986 175H1020"/>
<rect x="514" y="93" width="458" height="270" rx="22" fill="none" stroke="#806CFF" stroke-opacity=".25" stroke-dasharray="5 7"/>
